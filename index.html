<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="Simulador comercial de financiamento imobiliário do Corretor Norte.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Simulador Norte">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/main.css">
  <title>Simulador Imobiliário Norte</title>
</head>
<body>
  <a class="skip-link" href="#app-main">Ir para o conteúdo</a>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand-block" aria-label="Simulador Imobiliário Norte">
        <div class="brand-mark" aria-hidden="true">N</div>
        <div>
          <strong>Simulador Imobiliário Norte</strong>
          <span>Estimativa comercial de financiamento</span>
        </div>
      </div>

      <div class="header-actions">
        <span id="connection-status" class="status-pill" aria-live="polite">Verificando conexão...</span>
        <button id="install-button" class="button button-secondary" type="button" hidden>Instalar aplicativo</button>
      </div>
    </header>

    <nav class="app-nav" aria-label="Navegação principal">
      <a href="#/inicio" data-route="inicio">Início</a>
      <a href="#/comprador" data-route="comprador">Comprador</a>
      <a href="#/imovel" data-route="imovel">Imóvel</a>
      <a href="#/enquadramento" data-route="enquadramento">Enquadramento</a>
      <a href="#/fluxo" data-route="fluxo">Sugestão de Fluxo</a>
      <a href="#/resumo" data-route="resumo">Resumo</a>
    </nav>

    <div id="progress-region" class="progress-region" aria-live="polite"></div>

    <main id="app-main" class="app-main" tabindex="-1">
      <section id="app-view" aria-live="polite"></section>
    </main>

    <footer class="app-footer">
      <p>Esta simulação é uma estimativa comercial e não representa aprovação de crédito.</p>
      <small>Aplicativo v<span id="app-version">1.7.1</span> · Regras v<span id="rules-version">2026.08.01</span></small>
    </footer>
  </div>

  <noscript>
    <div class="noscript-message">Este aplicativo precisa do JavaScript ativado para funcionar.</div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
